<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harry Dingwall</title>
 
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #f7f7f5;
            color: #111;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .card {
            width: 90%;
            max-width: 360px;
            padding: 45px 35px;

            background: #fff;
            border: 1px solid #e5e5e5;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.05);

            text-align: center;

            animation: fadeIn 0.6s ease;
        }

        .eyebrow {
            margin-bottom: 12px;

            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;

            color: #999;
        }

        h1 {
            margin: 0 0 35px;

            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        input {
            width: 100%;
            padding: 12px 2px;

            border: none;
            border-bottom: 1px solid #ccc;
            outline: none;

            background: transparent;

            font-size: 15px;
            text-align: center;

            transition: border-color 0.2s ease;
        }

        input:focus {
            border-bottom-color: #111;
        }

        button {
            margin-top: 25px;
            padding: 11px 22px;

            border: none;
            background: #111;
            color: #fff;

            font-size: 13px;
            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        button:hover {
            background: #333;
            transform: translateY(-1px);
        }

        .error {
            min-height: 18px;
            margin-top: 15px;

            font-size: 12px;
            color: #c44;
        }

        footer {
            margin-top: 35px;

            font-size: 10px;
            letter-spacing: 0.15em;

            color: #aaa;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="eyebrow">Private</div>

        <h1>Harry Dingwall</h1>

        <form id="loginForm">
            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="off"
            >

            <button type="submit">
                Enter →
            </button>

            <div class="error" id="error"></div>
        </form>

        <footer>
            HD / 2026
        </footer>

    </main>

    <script>
        const CORRECT_PASSWORD = "pikachu";
        const REDIRECT_PAGE = "home.html";

        document
            .getElementById("loginForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                const error =
                    document.getElementById("error");

                if (password === CORRECT_PASSWORD) {
                    window.location.href = REDIRECT_PAGE;
                } else {
                    error.textContent = "Incorrect password.";
                }
            });
    </script>

</body>
</html>
